<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk It Through - Offline</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      color: #e2e8f0;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 480px;
    }
    .icon {
      font-size: 5.5rem;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }
    h1 {
      font-size: 2.1rem;
      margin-bottom: 1rem;
      color: #22c55e;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn {
      background: #22c55e;
      color: #111;
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
    }
    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🌿</div>
    <h1>You're Offline</h1>
    <p>
      Don't worry. Talk It Through is designed to support you even without internet.<br><br>
      Some features may be limited, but you can still access previously loaded content.
    </p>
    
    <button class="btn" onclick="window.location.reload()">
      Try Reconnecting
    </button>

    <div class="footer">
      Talk It Through • Mental Health Support<br>
      <small>You're not alone, even offline.</small>
    </div>
  </div>
</body>
</html>
